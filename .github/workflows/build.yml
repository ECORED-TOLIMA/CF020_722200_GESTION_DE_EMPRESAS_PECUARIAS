name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - master # Se ejecuta cuando hay cambios en master
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write # Necesario para hacer push a la rama gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historial completo para que funcione git subtree split

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm

      - name: Install Dependencies
        run: npm ci # Usa package-lock.json para instalaciones rápidas y estables

      - name: Build Vue App
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b newdist
          git add --force dist
          git commit -m "Deploy to GitHub Pages 🚀"
          git push origin `git subtree split --prefix dist newdist`:gh-pages --force
